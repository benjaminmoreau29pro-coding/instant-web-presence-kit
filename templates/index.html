<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{BUSINESS_NAME}} | {{TAGLINE}}</title>
    <meta name="description" content="{{DESCRIPTION}}">
    <meta name="theme-color" content="{{PRIMARY_COLOR}}">
    <link rel="stylesheet" href="style.css">
</head>

<body class="{{THEME_CLASS}}">

    <header class="header">
        <div class="container">
            <div class="logo">{{BUSINESS_NAME}}</div>
            <nav class="nav">
                <a href="index.html">Accueil</a>
                <a href="services.html">Services</a>
                <a href="about.html">À Propos</a>
                <a href="contact.html">Contact</a>
            </nav>
        </div>
    </header>

    <section class="section-hero">
        <div class="hero-content container">
            <h1>{{TAGLINE}}</h1> 
            <p>{{DESCRIPTION}}</p>
            <a href="contact.html" class="cta-button">
                {{PROFILE_CTA_TEXT}}
            </a>
        </div>
    </section>

    <section class="section-services section-content">
        <div class="container">
            <h2>Nos Services Clés</h2>
            <div class="services-list services-grid">
                <div class="service-card">
                    <h3>Service 1</h3>
                    <p>{{SERVICE_1}}</p>
                </div>
                <div class="service-card">
                    <h3>Service 2</h3>
                    <p>{{SERVICE_2}}</p>
                </div>
                <div class="service-card">
                    <h3>Service 3</h3>
                    <p>{{SERVICE_3}}</p>
                </div>
            </div>
        </div>
    </section>

    <section class="section-about section-content">
        <div class="container">
            <h2>À Propos de nous</h2>
            <p>{{ABOUT_TEXT}}</p>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <p>&copy; {{BUSINESS_NAME}} - Tous droits réservés.</p>
            <p>Contact: <a href="mailto:{{EMAIL}}">{{EMAIL}}</a></p>
        </div>
    </footer>

</body>
</html>
